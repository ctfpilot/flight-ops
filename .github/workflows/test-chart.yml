name: Test Chart

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare operator
        run: |
          go mod tidy
          make docker-build IMG=operator:v0.1.0
          kind load docker-image operator:v0.1.0

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart
          helm lint ./dist/dispatcher/chart

      - name: Install cert-manager via Helm
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true

      - name: Wait for cert-manager to be ready
        run: |
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager-cainjector
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager-webhook

      - name: Install kube-prometheus-stack via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace --wait --timeout 10m --set grafana.enabled=false --set alertmanager.enabled=false

      - name: Verify kube-prometheus-stack release status
        run: |
          helm status kube-prometheus-stack --namespace monitoring

      - name: Install Helm chart for project
        run: |
          helm install my-release ./dist/chart --create-namespace --namespace operator-system --set prometheus.enable=true --set prometheus.serviceMonitor.additionalLabels.release=kube-prometheus-stack

      - name: Check Helm release status
        run: |
          helm status my-release --namespace operator-system

      - name: Check Presence of ServiceMonitor
        run: |
          kubectl wait --namespace operator-system --for=jsonpath='{.kind}'=ServiceMonitor servicemonitor/flight-ops-controller-manager-metrics-monitor

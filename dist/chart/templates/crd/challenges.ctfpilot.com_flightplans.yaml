{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: flightplans.challenges.ctfpilot.com
spec:
  group: challenges.ctfpilot.com
  names:
    kind: FlightPlan
    listKind: FlightPlanList
    plural: flightplans
    singular: flightplan
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FlightPlan is the static definition/blueprint of a challenge
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FlightPlanSpec defines the desired state of FlightPlan
            properties:
              category:
                description: Category is the type of challenge (web, pwn, crypto,
                  etc.)
                type: string
              defaultTTL:
                description: DefaultTTL is the default Time-To-Live in seconds for
                  instanced flights (e.g., 3600)
                format: int32
                type: integer
              endpoints:
                description: Endpoints defines domain routing rules for Traefik and
                  connection strings
                properties:
                  subdomains:
                    description: |-
                      Subdomains defines the instanced subdomains for dynamic routing via Traefik (over TLS 443)
                      Corresponds to CTF Pilot instanced_subdomains
                    items:
                      description: SubdomainSpec defines a single entry in instanced_subdomains
                      properties:
                        connectionTemplate:
                          description: |-
                            ConnectionTemplate is a raw string format shown in CTFd for static/shared challenges.
                            Supports variable substitution like "{{ .host }}" or "nc {{ .host }} 1337"
                          type: string
                        name:
                          description: Name is the subdomain prefix (e.g. "api", "admin",
                            "pwn")
                          type: string
                        protocol:
                          default: web
                          description: Protocol dictates how Traefik routes traffic
                            (web = HTTP Ingress, tcp = IngressRouteTCP)
                          enum:
                          - web
                          - tcp
                          type: string
                      required:
                      - name
                      - protocol
                      type: object
                    type: array
                type: object
              firstDepartureAt:
                description: |-
                  FirstDepartureAt is a Unix timestamp indicating when this flight is allowed to first be launched.
                  0 means immediately available.
                format: int64
                type: integer
              mode:
                description: Mode dictates where this flight lands ("shared" or "instanced")
                enum:
                - shared
                - instanced
                type: string
              resources:
                description: Resources contains raw Kubernetes manifests (Deployments,
                  Services, Traefik Ingresses)
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
                x-kubernetes-preserve-unknown-fields: true
            required:
            - category
            - mode
            - resources
            type: object
        type: object
    served: true
    storage: true
{{- end -}}

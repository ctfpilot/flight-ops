{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: flight-ops-mutating-webhook-configuration
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.certmanager.enable }}
    cert-manager.io/inject-ca-from: "{{ $.Release.Namespace }}/serving-cert"
    {{- end }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
webhooks:
  - name: mflightplan-v1alpha1.kb.io
    clientConfig:
      service:
        name: flight-ops-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-challenges-ctfpilot-com-v1alpha1-flightplan
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions:
      - v1
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - challenges.ctfpilot.com
        apiVersions:
          - v1alpha1
        resources:
          - flightplans
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: flight-ops-validating-webhook-configuration
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.certmanager.enable }}
    cert-manager.io/inject-ca-from: "{{ $.Release.Namespace }}/serving-cert"
    {{- end }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
webhooks:
  - name: vflightplan-v1alpha1.kb.io
    clientConfig:
      service:
        name: flight-ops-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-challenges-ctfpilot-com-v1alpha1-flightplan
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions:
      - v1
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - challenges.ctfpilot.com
        apiVersions:
          - v1alpha1
        resources:
          - flightplans
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatcher-access
rules:
- apiGroups: [ "challenges.ctfpilot.com" ]
  resources: [ "flightplans" ]
  verbs: [ "get", "list" ]
- apiGroups: [ "challenges.ctfpilot.com" ]
  resources: [ "flights" ]
  verbs: [ "get", "list", "create", "update", "patch", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatcher-access-binding
subjects:
- kind: ServiceAccount
  name: dispatcher
  namespace: default
roleRef:
  kind: ClusterRole
  name: dispatcher-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
data:
  secretKey: MzNUdEk0TG5vUDlmS2JyNmNMdU1lRUs2U3Q3TlgwSHAK # 33TtI4LnoP9fKbr6cLuMeEK6St7NX0Hp
  audience: Z3JvdW5kLWNvbnRyb2wtZGlzcGF0Y2hlcg== # ground-control-dispatcher
  issuers: aXNzdWVyMSxpc3N1ZXIy # issuer1,issuer2
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: dispatcher-secret
data:
  secretKey: bHdhVEUyYzJ3MXY1cnhhZWNNYjFoZ1ZOYklZUTNLVDcK # lwaTE2c2w1v5rxaecMb1hgVNbIYQ3KT7
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  labels:
    app.kubernetes.io/name: dispatcher
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatcher
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatcher
    spec:
      serviceAccountName: dispatcher
      imagePullSecrets:
      - name: ghcr
      containers:
      - name: challenge-provider
        image: ghcr.io/ctfpilot/flight-ops-dispatcher:1.2.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secretKey
        - name: JWT_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: audience
        - name: JWT_ISSUERS
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: issuers
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: dispatcher-secret
              key: secretKey
        - name: MAX_CONCURRENT_FLIGHTS
          value: "5"
        - name: FLIGHT_DOMAIN
          value: "localhost"
        - name: METRICS_BIND_ADDRESS
          value: ":9090"
        - name: REDIS_ADDR
          value: "redis:6379"
        - name: REDIS_PASSWORD
          value: ""
        - name: REDIS_DB
          value: "0"
        - name: REDIS_KEY_PREFIX
          value: "dispatcher:rate-limit"
        - name: RATE_LIMIT_LIST_MAX
          value: "120"
        - name: RATE_LIMIT_LIST_WINDOW_SECONDS
          value: "60"
        - name: RATE_LIMIT_READ_MAX
          value: "120"
        - name: RATE_LIMIT_READ_WINDOW_SECONDS
          value: "60"
        - name: RATE_LIMIT_DEPART_MAX
          value: "20"
        - name: RATE_LIMIT_DEPART_WINDOW_SECONDS
          value: "60"
        - name: RATE_LIMIT_REFRESH_MAX
          value: "20"
        - name: RATE_LIMIT_REFRESH_WINDOW_SECONDS
          value: "60"
        - name: RATE_LIMIT_LAND_MAX
          value: "20"
        - name: RATE_LIMIT_LAND_WINDOW_SECONDS
          value: "60"
        livenessProbe:
          httpGet:
            path: /status
            port: 8080
        readinessProbe:
          httpGet:
            path: /status
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
spec:
  type: "NodePort"
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 30080
  selector:
    app.kubernetes.io/name: dispatcher
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app.kubernetes.io/name: dispatcher

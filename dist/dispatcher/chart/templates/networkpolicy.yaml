apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dispatcher.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dispatcher.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dispatcher.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # API
    - from:
        - namespaceSelector:
            matchLabels:
              {{ range $key, $value := .Values.dispatcher.networkPolicy.allowedNamespaceLabels }}
              {{ $key }}: {{ $value | quote }}
              {{ end }}
      ports:
        - port: {{ .Values.dispatcher.port }}
          protocol: TCP
    # Metrics
    - from:
        - namespaceSelector:
            matchLabels:
              {{ range $key, $value := .Values.metrics.networkPolicy.allowedNamespaceLabels }}
              {{ $key }}: {{ $value | quote }}
              {{ end }}
      ports:
        - port: {{ .Values.metrics.service.port }}
          protocol: TCP
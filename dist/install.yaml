  - flight-ops-webhook-service.flight-ops-system.svc
  - flight-ops-webhook-service.flight-ops-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: flight-ops-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: flight-ops
  name: flight-ops-selfsigned-issuer
  namespace: flight-ops-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: flight-ops-system/flight-ops-serving-cert
  name: flight-ops-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: flight-ops-webhook-service
      namespace: flight-ops-system
      path: /mutate-challenges-ctfpilot-com-v1alpha1-flightplan
  failurePolicy: Fail
  name: mflightplan-v1alpha1.kb.io
  rules:
  - apiGroups:
    - challenges.ctfpilot.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - flightplans
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: flight-ops-system/flight-ops-serving-cert
  name: flight-ops-validating-webhook-configuration
